server.port: 9999

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: gateway-ecommerce
  config:
    import:
      - aws-secretsmanager:/secret/algashop/gateway-ecommerce/redis-password?prefix=gateway-ecommerce.secrets.
      - aws-parameterstore:/config/algashop/gateway-ecommerce?prefix=gateway-ecommerce.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  data:
    redis:
      host: ${gateway-ecommerce.params.redis.host}
      port: ${gateway-ecommerce.params.redis.port}
      password: ${gateway-ecommerce.secrets.redis-password}
      database: ${gateway-ecommerce.params.redis.database}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
    gateway:
      server:
        webflux:
          route-refresh-listener:
            enabled: false
#          filter:
#            local-response-cache:
#              enabled: true
#              time-to-live: 1m
#              size: 10MB
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            #- Retry=3,INTERNAL_SERVER_ERROR,GET,10ms,50ms,2,false # shorter version of the below configuration
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 20ms
          httpclient:
            connect-timeout: 1000
            response-timeout: 5000
#          globalcors:
#            add-to-simple-url-handler-mapping: true
#            cors-configurations:
#              '[/**]':
#                allowedOrigins: http://admin.algashop.local:4200
#                allowedHeaders: '*'
#                allowedMethods:
#                  - GET
#                  - POST
#                  - PUT
#                  - DELETE
#                  - OPTIONS
          routes:
            - id: billing-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/customers/me/credit-cards,/api/v1/customers/me/credit-cards/{creditCardId}
                - Method=GET,POST,PUT,DELETE,OPTIONS
            - id: ordering-route
              uri: lb://ordering
              predicates:
                - Path=/api/v1/customers/**,/api/v1/shipping-cost-previews
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - name: CircuitBreaker
                  args:
                    name: ordering-route-cb
                    statusCodes:
                      - 502
                      - 504
                      - 500
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
                - LocalResponseCache=1m,30MB
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter:
                      replenishRate: 50 # how many tokens are added to the token bucket every second 
                      burstCapacity: 200 # maximum number of tokens the bucket can hold
                      requestedTokens: 1 # token cost for a single request
                    key-resolver: "#{@rateLimitKeyResolver}"
#            - id: product-catalog-test-route
#              uri: lb://product-catalog
#              predicates:
#                - Path=/products/**
#              filters:
#                - RewritePath=/public/products(?<segment>/?.*), /api/v1/products$\{segment}
#                - AddResponseHeader=X-Path-rewrite-info, Path have been rewrite to /api/v1/products
#                - name: RewritePath
#                  args:
#                    regexp: /products/?(?<segment>.*)
#                    replacement: /api/v1/products$\{segment}
#              metadata:
#                cors:
#                  allowedOrigins: http://localhost:4200
#                  allowedMethods:
#                    - GET
#                    - POST
#                  allowedHeaders: '*'
#                  maxAge: 30
#                response-timeout: 1000
#                connect-timeout: 1000
            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    registerWithEureka: false
    fetchRegistry: true
  instance:
    instanceId: ${random.uuid}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, circuitbreakers
  endpoint:
    gateway:
      enabled: true

resilience4j.circuitbreaker:
  instances:
    ordering-route-cb:
      slidingWindowSize: 8 # total calls to analyze
      failureRateThreshold: 50 # 50%
      minimumNumberOfCalls: 5 # minimum number of failures to calculate if its failing
      permittedNumberOfCallsInHalfOpenState: 5
      slidingWindowType: COUNT_BASED # / TIME_BASED
      waitDurationInOpenState: 10s
      maxWaitDurationInHalfOpenState: 30s
      registerHealthIndicator: true # enable circuitbreakers health check